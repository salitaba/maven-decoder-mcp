interface:
  display_name: "Maven Code Search"
  short_description: "Search Maven package code, locally and on Maven Central"
  default_prompt: "Use $maven-code-search to inspect Maven dependencies and search package code, including artifacts not installed locally."

dependencies:
  tools:
    - type: "mcp"
      value: "maven-decoder"
      description: "Maven Decoder MCP server for searching and decompiling Maven artifacts from the local repository and from Maven Central"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
