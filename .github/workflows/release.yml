name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match the tag, e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write
  id-token: write

env:
  # Keep CI hermetic: never reach out to Maven Central during tests, so a
  # throttled or unreachable index cannot block a release.
  MAVEN_OFFLINE: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Sync versions from tag
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "Release version: $VERSION"
        # pyproject.toml is the single source of truth; the tag wins.
        sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"${VERSION}\"/" pyproject.toml
        # package.json must match so npm and PyPI publish the same version.
        # The pattern allows an optional '-rc.N' suffix (it is tolerated, not required).
        sed -i -E "s/\"version\": \"[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?\"/\"version\": \"${VERSION}\"/" package.json
        # __init__.py mirrors the version for source checkouts, where the
        # installed distribution metadata is not available.
        sed -i -E "s/__version__ = \"[^\"]+\"/__version__ = \"${VERSION}\"/" maven_decoder_mcp/__init__.py __init__.py
        echo "pyproject.toml version => $(grep '^version = ' pyproject.toml | head -n1)"
        echo "package.json version   => $(grep '"version"' package.json | head -n1)"
        echo "package __version__    => $(grep -h '__version__' maven_decoder_mcp/__init__.py | head -n1)"
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
        pip install -e .
    
    - name: Setup decompilers
      run: ./setup_decompilers.sh
      
    - name: Run tests
      run: |
        python test_startup.py
        python -c "from maven_decoder_mcp import MavenDecoderServer; print('✅ Package import successful')"
        
    - name: Run pagination and summarization tests
      run: |
        echo "🧪 Running pagination and summarization tests..."
        python -c "import sys; print('Python executable:', sys.executable)"
        python run_tests.py
        
    - name: Run pytest tests
      run: |
        echo "🧪 Running pytest test suite..."
        python -m pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Sync versions from tag
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "Release version: $VERSION"
        # pyproject.toml is the single source of truth; the tag wins.
        sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"${VERSION}\"/" pyproject.toml
        # package.json must match so npm and PyPI publish the same version.
        sed -i -E "s/\"version\": \"[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?\"/\"version\": \"${VERSION}\"/" package.json
        # __init__.py mirrors the version for source checkouts, where the
        # installed distribution metadata is not available.
        sed -i -E "s/__version__ = \"[^\"]+\"/__version__ = \"${VERSION}\"/" maven_decoder_mcp/__init__.py __init__.py
        echo "pyproject.toml version => $(grep '^version = ' pyproject.toml | head -n1)"
        echo "package.json version   => $(grep '"version"' package.json | head -n1)"
        echo "package __version__    => $(grep -h '__version__' maven_decoder_mcp/__init__.py | head -n1)"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel twine setuptools
        pip install -r requirements.txt
    
    - name: Setup decompilers
      run: ./setup_decompilers.sh
    
    - name: Build Python package
      run: |
        python -m build
    
    - name: Build npm package
      run: |
        npm pack
    
    # Release notes must describe THIS release. The drafter commits a
    # RELEASE_NOTES.md (via scripts/generate_release_notes.py) before tagging;
    # CI checks it covers the tag and regenerates from git history when it is
    # missing, so a stale body can never ship again. docker hub description is
    # bumped in the same step (see below).
    - name: Create release notes
      run: |
        if [ -f "RELEASE_NOTES.md" ] && [ -s "RELEASE_NOTES.md" ]; then
          if grep -q "${{ github.ref_name }}" RELEASE_NOTES.md; then
            echo "Using prepared RELEASE_NOTES.md from the repo"
          else
            echo "Prepared RELEASE_NOTES.md does not cover ${{ github.ref_name }}; regenerating"
            python3 scripts/generate_release_notes.py --tag "${{ github.ref_name }}" --out RELEASE_NOTES.md
          fi
        else
          echo "No prepared RELEASE_NOTES.md; generating from git history"
          python3 scripts/generate_release_notes.py --tag "${{ github.ref_name }}" --out RELEASE_NOTES.md
        fi
        echo "--- RELEASE_NOTES.md ---"
        cat RELEASE_NOTES.md
    
    - name: Upload Python package to PyPI
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "::error::PYPI_API_TOKEN secret is not set; aborting publish"
          exit 1
        fi
        twine upload --skip-existing dist/*
    
    - name: Publish npm package
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: |
        # Trusted publishing (OIDC): no NPM_TOKEN needed. Requires the
        # npmjs.com trusted publisher entry for this repo + workflow.
        npm publish maven-decoder-mcp-*.tgz --provenance
    
    - name: Create GitHub Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*
          maven-decoder-mcp-*.tgz
          RELEASE_NOTES.md
        body_path: RELEASE_NOTES.md
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Check Docker Hub credentials
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: |
        if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
          echo "::error::DOCKER_USERNAME / DOCKER_PASSWORD secrets are not set; aborting docker publish"
          exit 1
        fi

    - name: Login to Docker Hub
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ali79taba/maven-decoder-mcp
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build Python package first
      run: |
        python -m pip install --upgrade pip build wheel setuptools
        pip install -r requirements.txt
        python -m build
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        sbom: true
        provenance: true
        platforms: linux/amd64,linux/arm64
